name: Build Windows App

# Har push par (kisi bhi branch par) Windows .exe banega.
# Actions tab -> Run workflow se bhi chala sakte ho.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build .exe (installer + portable)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Kirana-Rate-Register-v${{ steps.ver.outputs.v }}
          path: dist/*.exe

      - name: Release banao (exe download ke liye)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build${{ github.run_number }}
          name: Kirana Rate Register v${{ steps.ver.outputs.v }} (build ${{ github.run_number }}, ${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'main' }}
          files: dist/*.exe
